name: CI

on:
  push:
    branches: [main, 'feature/**', 'fix/**']
  pull_request:
    branches: [main, 'feature/**', 'fix/**']

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://modulo1_app:modulo1_app_ci_secret_12@localhost:5432/modulo1_ci
      DATABASE_URL_MIGRATIONS: postgresql+psycopg://modulo1_owner:modulo1_owner_ci_secret_12@localhost:5432/modulo1_ci
      JWT_SECRET: ci-jwt-secret-minimum-thirty-two-characters-long
      STORAGE_SECRET: ci-storage-secret-minimum-thirty-two-characters-long
      ENV_FILE: .env.ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/requirements-dev.lock
      - name: Install dependencies
        run: pip install -r requirements.lock -r requirements-dev.lock
      - name: Bootstrap Postgres roles and database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 \
            -v owner_password='modulo1_owner_ci_secret_12' \
            -v app_password='modulo1_app_ci_secret_12' \
            -f scripts/crear_roles.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 \
            -v db=modulo1_ci \
            -f scripts/crear_base.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 \
            -v db=modulo1_ci_demo \
            -f scripts/crear_base.sql
      - name: Alembic upgrade head
        run: python -m alembic upgrade head
      - name: Alembic upgrade head (base demo CI)
        env:
          DATABASE_URL_MIGRATIONS: postgresql+psycopg://modulo1_owner:modulo1_owner_ci_secret_12@localhost:5432/modulo1_ci_demo
        run: python -m alembic upgrade head
      - name: Pytest (suite completa, sin sembrado demo)
        run: python -m pytest -q --ignore=tests/test_sembrar_demo.py
      - name: Sembrado demo (corrida completa, logs)
        env:
          DATABASE_URL: postgresql+psycopg://modulo1_app:modulo1_app_ci_secret_12@localhost:5432/modulo1_ci_demo
          DATABASE_URL_MIGRATIONS: postgresql+psycopg://modulo1_owner:modulo1_owner_ci_secret_12@localhost:5432/modulo1_ci_demo
          DATABASE_URL_ADMIN: postgresql://postgres:postgres@localhost:5432/postgres
          DEMO_PASSWORD: demo-secreto-12
        run: python scripts/sembrar_demo.py --reset --importar-planillas
      - name: Pytest (sembrado demo en modulo1_ci_demo)
        env:
          DATABASE_URL: postgresql+psycopg://modulo1_app:modulo1_app_ci_secret_12@localhost:5432/modulo1_ci_demo
          DATABASE_URL_MIGRATIONS: postgresql+psycopg://modulo1_owner:modulo1_owner_ci_secret_12@localhost:5432/modulo1_ci_demo
          DATABASE_URL_ADMIN: postgresql://postgres:postgres@localhost:5432/postgres
          DEMO_PASSWORD: demo-secreto-12
        run: python -m pytest tests/test_sembrar_demo.py -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
